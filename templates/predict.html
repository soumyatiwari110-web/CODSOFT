<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Survival | Titanic AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark st-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand st-brand" href="/"><i class="fas fa-ship me-2"></i>RMS Titanic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/predict">Predict</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="st-predict-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="text-center mb-5 mt-5 pt-4">
                    <p class="st-tagline">PASSENGER MANIFEST</p>
                    <h2 class="st-page-title">Enter Your Details</h2>
                    <p class="st-page-sub">Fill in your passenger information as it would have appeared in 1912</p>
                </div>

                <div class="st-form-card">
                    <form action="/predict" method="POST" id="predictionForm">

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="st-label">
                                    <i class="fas fa-ticket-alt me-2 st-gold"></i>Passenger Class
                                </label>
                                <select name="pclass" class="st-select" required>
                                    <option value="">Select Class</option>
                                    <option value="1">🥇 1st Class — Upper Deck</option>
                                    <option value="2">🥈 2nd Class — Middle Deck</option>
                                    <option value="3">🥉 3rd Class — Lower Deck</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="st-label">
                                    <i class="fas fa-user me-2 st-gold"></i>Gender
                                </label>
                                <div class="st-gender-selector">
                                    <input type="radio" name="sex" id="male" value="male" checked>
                                    <label for="male" class="st-gender-btn">
                                        <i class="fas fa-mars"></i> Male
                                    </label>
                                    <input type="radio" name="sex" id="female" value="female">
                                    <label for="female" class="st-gender-btn">
                                        <i class="fas fa-venus"></i> Female
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="st-label">
                                    <i class="fas fa-birthday-cake me-2 st-gold"></i>Age
                                    <span class="st-hint">years old</span>
                                </label>
                                <input type="number" name="age" class="st-input"
                                       min="0" max="100" step="0.5"
                                       placeholder="e.g. 28" required>
                                <div class="st-slider-row">
                                    <input type="range" class="st-slider" id="ageSlider"
                                           min="1" max="80" value="28">
                                    <span class="st-slider-val" id="ageVal">28</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="st-label">
                                    <i class="fas fa-pound-sign me-2 st-gold"></i>Fare Paid
                                    <span class="st-hint">in British pounds</span>
                                </label>
                                <input type="number" name="fare" class="st-input"
                                       min="0" max="600" step="0.01"
                                       placeholder="e.g. 32.50" required>
                                <p class="st-hint mt-1">3rd ~£7 · 2nd ~£15 · 1st ~£30-500</p>
                            </div>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="st-label">
                                    <i class="fas fa-heart me-2 st-gold"></i>Siblings / Spouses Aboard
                                </label>
                                <div class="st-counter-group">
                                    <button type="button" class="st-counter-btn"
                                            onclick="changeCount('sibsp', -1)">−</button>
                                    <input type="number" name="sibsp" id="sibsp"
                                           class="st-counter-input" value="0" min="0" max="8" readonly>
                                    <button type="button" class="st-counter-btn"
                                            onclick="changeCount('sibsp', 1)">+</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="st-label">
                                    <i class="fas fa-baby me-2 st-gold"></i>Parents / Children Aboard
                                </label>
                                <div class="st-counter-group">
                                    <button type="button" class="st-counter-btn"
                                            onclick="changeCount('parch', -1)">−</button>
                                    <input type="number" name="parch" id="parch"
                                           class="st-counter-input" value="0" min="0" max="6" readonly>
                                    <button type="button" class="st-counter-btn"
                                            onclick="changeCount('parch', 1)">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="st-label">
                                <i class="fas fa-anchor me-2 st-gold"></i>Port of Embarkation
                            </label>
                            <div class="st-port-selector">
                                <input type="radio" name="embarked" id="portS" value="S" checked>
                                <label for="portS" class="st-port-btn">
                                    <span class="st-port-code">S</span>
                                    <span class="st-port-name">Southampton</span>
                                    <span class="st-port-sub">England · Most common</span>
                                </label>
                                <input type="radio" name="embarked" id="portC" value="C">
                                <label for="portC" class="st-port-btn">
                                    <span class="st-port-code">C</span>
                                    <span class="st-port-name">Cherbourg</span>
                                    <span class="st-port-sub">France · 2nd stop</span>
                                </label>
                                <input type="radio" name="embarked" id="portQ" value="Q">
                                <label for="portQ" class="st-port-btn">
                                    <span class="st-port-code">Q</span>
                                    <span class="st-port-name">Queenstown</span>
                                    <span class="st-port-sub">Ireland · Last stop</span>
                                </label>
                            </div>
                        </div>

                        <div class="text-center mt-5">
                            <button type="submit" class="st-btn-primary w-100" id="submitBtn">
                                <span id="btnText">
                                    <i class="fas fa-ship me-2"></i>Predict My Survival
                                </span>
                                <span id="btnLoading" style="display:none;">
                                    <i class="fas fa-spinner fa-spin me-2"></i>Analyzing...
                                </span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="st-footer">
    <div class="container text-center">
        <p class="st-footer-name">Built by <span class="st-gold">Soumya Tiwari</span></p>
        <p class="st-footer-copy">© 2024 Titanic Survival Prediction System</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
